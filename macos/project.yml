name: CCUsageMonitor
options:
  bundleIdPrefix: com.shanedolley
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  CCUsageMonitor:
    type: application
    platform: macOS
    sources:
      - path: CCUsageMonitor
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanedolley.ccusagemonitor
        PRODUCT_NAME: CCUsageMonitor
        CODE_SIGN_ENTITLEMENTS: CCUsageMonitor/Resources/CCUsageMonitor.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: CCUsageMonitor/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: CC Usage Monitor
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: Shane Dolley
  CCUsageMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CCUsageMonitorTests
    dependencies:
      - target: CCUsageMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanedolley.ccusagemonitorTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CCUsageMonitor:
    build:
      targets:
        CCUsageMonitor: all
        CCUsageMonitorTests: [test]
    test:
      targets:
        - CCUsageMonitorTests
